name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/merlindrones/fog-ros-baseimage-builder:sha-7fca749
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v3

      - name: Install additional tools and libraries
        run: |
          apt-get update
          apt-get install -y \
            make \
            ros-jazzy-action-msgs \
            ros-jazzy-action-tutorials-interfaces \
            ros-jazzy-action-tutorials-cpp \
            ros-jazzy-demo-nodes-cpp \
            ros-jazzy-demo-nodes-py \
            ros-jazzy-rmw-cyclonedds-cpp \
            ros-jazzy-rmw-zenoh-cpp \
            ros-jazzy-example-interfaces \
            ros-jazzy-test-msgs

      - name: Run tests with the race detector
        run: make test-race

      - name: Run tests on every installed RMW
        run: make test-rmw

      - name: Make every rcl call fail in turn
        run: make test-faults

      - name: Check test coverage
        run: make cover

  run-linter:
    runs-on: ubuntu-latest
    container: ghcr.io/merlindrones/fog-ros-baseimage-builder:sha-7fca749
    steps:
      - uses: actions/checkout@v3

      - name: Prepare environment
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            ros-jazzy-action-msgs \
            ros-jazzy-action-tutorials-interfaces \
            ros-jazzy-example-interfaces \
            ros-jazzy-test-msgs
          env > "$GITHUB_ENV"

      - uses: golangci/golangci-lint-action@v3
